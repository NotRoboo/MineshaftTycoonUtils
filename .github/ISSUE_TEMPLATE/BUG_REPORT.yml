name: Bug Report
description: Report something that isn't working correctly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the sections below as completely as you can.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: List the steps needed to reproduce the issue.
      placeholder: |
        1. Enable the Warp Helper in the config
        2. Type /warp gravel
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: input
    id: mod-version
    attributes:
      label: Mod Version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: mc-version
    attributes:
      label: Minecraft Version
      placeholder: e.g. 1.21.11
    validations:
      required: true

  - type: input
    id: fabric-versions
    attributes:
      label: Fabric Loader / Fabric API Versions
      placeholder: e.g. Loader 0.19.2, Fabric API 0.141.3
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any relevant errors from `.minecraft/logs/latest.log`, or a link to a paste site.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, config values, or anything else that might help.
    validations:
      required: false